<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 52" width="500" height="52" fill="none">
  <defs>
    <!-- Google Gemini Gradient -->
    <linearGradient id="geminiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E75FF"/>
      <stop offset="50%" stop-color="#7C69EF"/>
      <stop offset="100%" stop-color="#D96570"/>
